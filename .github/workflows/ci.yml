name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the pnpm that wrote pnpm-lock.yaml: `--frozen-lockfile` fails on a
      # different lockfile format, and CI must not silently re-resolve it.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      # `pnpm test` runs the build first, so the TypeScript check, both tsdown
      # artifacts, and the 14 smoke tests all gate this step.
      - name: Build and test
        run: pnpm test
